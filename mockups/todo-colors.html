<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;background:#141B2D;font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;color:#E4E9F3}
.opt{width:390px;padding:14px}
.t{font-size:14px;font-weight:700;margin:0 0 8px}.t span{font-weight:400;color:#9AA5BC;font-size:12.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{border-radius:14px;padding:10px 14px;border:2px solid;color:#141B2D}
.c small{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}.c b{display:block;font-size:32px;line-height:1.15;color:#D01E12}.c span{font-size:14.5px;font-weight:700}
.ic{font-size:15px}
</style></head><body>
<section class="opt" id="p1"><p class="t">추천 ① 주황 + 초록 <span>(하는 일의 성격: 시작 / 마무리)</span></p>
<div class="row"><div class="c" style="background:#FFD7A8;border-color:#F08A00"><small><span class="ic">📋</span>새 민원</small><b>1</b><span>지시해 주세요</span></div>
<div class="c" style="background:#BFEBD5;border-color:#1F9D6B"><small><span class="ic">💬</span>직원 완료 보고</small><b>1</b><span>회신해 주세요</span></div></div></section>
<section class="opt" id="p2"><p class="t">추천 ② 본사 그래프 색과 통일 <span>(지시 대기 = 파랑, 회신 대기 = 초록)</span></p>
<div class="row"><div class="c" style="background:#CFE2FA;border-color:#2a78d6"><small><span class="ic">📋</span>새 민원</small><b>1</b><span>지시해 주세요</span></div>
<div class="c" style="background:#BFEBD5;border-color:#1F9D6B"><small><span class="ic">💬</span>직원 완료 보고</small><b>1</b><span>회신해 주세요</span></div></div></section>
<section class="opt" id="p3"><p class="t">추천 ③ 노랑 유지 + 회신만 분홍 <span>(지금 느낌 유지)</span></p>
<div class="row"><div class="c" style="background:#FFE15A;border-color:#E0B400"><small><span class="ic">📋</span>새 민원</small><b>1</b><span>지시해 주세요</span></div>
<div class="c" style="background:#FFD1DC;border-color:#E0567A"><small><span class="ic">💬</span>직원 완료 보고</small><b>1</b><span>회신해 주세요</span></div></div></section>
</body></html>
